<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102d2b"><title>کافه‌کتاب سیمرغ | نسخه بازطراحی</title>
<style>
:root{--bg:#0d2424;--panel:#153735;--panel2:#1d4540;--gold:#dfb45f;--gold2:#f4d995;--ink:#f7f0df;--muted:#b4c4b8;--line:#45665b;--red:#db8574;--green:#8fcea4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a403b,var(--bg) 60%);color:var(--ink);font-family:Tahoma,Vazirmatn,sans-serif;min-height:100vh;padding-bottom:88px}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#102d2bea;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}.brand{font-size:18px;color:var(--gold2);font-weight:bold;flex:1}.user{font-size:12px;color:var(--muted)}main{max-width:1050px;margin:auto;padding:18px}.hero{border:1px solid var(--line);border-radius:24px;padding:24px;background:linear-gradient(120deg,#285247,#122d2b);margin-bottom:18px}.hero h1{color:var(--gold2);margin:0 0 8px;font-size:27px}.hero p{color:var(--muted);line-height:2;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:18px 0}.tile,.card,.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:17px;padding:15px}.tile{text-align:right;color:var(--ink);min-height:90px}.tile b{display:block;color:var(--gold2);font-size:15px;margin-bottom:7px}.tile span{font-size:12px;color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.section-title h2{font-size:18px;color:var(--gold2);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card h3{margin:8px 0;color:var(--gold2);font-size:16px}.card p{font-size:13px;color:var(--muted);line-height:1.9}.cover{height:130px;border-radius:12px;background:linear-gradient(135deg,#315a4e,#1a3934);display:grid;place-items:center;font-size:42px;color:var(--gold2);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.price{color:var(--gold2);font-weight:bold}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--gold);border-radius:11px;padding:9px 13px;background:linear-gradient(#edc979,#c99a42);color:#1c190f;font-weight:bold}.btn.ghost{background:transparent;color:var(--gold2)}.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:8px 14px;background:var(--panel);color:var(--muted)}.tabs button.active{background:var(--gold);color:#201a0c}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0f2927;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.bottom{position:fixed;z-index:10;bottom:0;right:0;left:0;display:flex;gap:2px;overflow:auto;padding:7px 5px calc(7px + env(safe-area-inset-bottom));background:#102d2bf5;border-top:1px solid var(--line)}.bottom button{flex:1;min-width:62px;border:0;background:transparent;color:var(--muted);font-size:10px;padding:5px 2px}.bottom button.active{color:var(--gold2)}.bottom i{display:block;font-style:normal;font-size:20px;margin-bottom:4px}.pill{display:inline-block;border:1px solid var(--line);border-radius:15px;padding:3px 9px;font-size:11px;color:var(--gold2)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.modal{position:fixed;inset:0;z-index:20;background:#0009;display:grid;place-items:center;padding:16px}.dialog{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--gold);border-radius:20px;padding:18px}.hidden{display:none!important}.notice{border-right:3px solid var(--gold);padding:10px 12px;background:#ffffff0a;border-radius:8px;margin:8px 0;color:var(--muted);font-size:12px;line-height:1.8}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{border-bottom:1px solid var(--line);padding:10px;text-align:right}.table th{color:var(--gold2)}@media(max-width:600px){main{padding:12px}.hero{padding:18px}.hero h1{font-size:22px}.user{display:none}}
</style></head>
<body>
<header class="top"><div class="brand">✦ کافه‌کتاب سیمرغ</div><div class="user" id="userBadge">مهمان · نسخه نمایشی</div><button class="btn small ghost" onclick="toggleRole()">تغییر نقش</button></header>
<main id="view"></main>
<nav class="bottom" id="nav"></nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div>
<script>
const $=s=>document.querySelector(s);
const initial={
 cafeCats:[{id:1,name:'نوشیدنی گرم',icon:'☕'},{id:2,name:'نوشیدنی سرد',icon:'🧋'},{id:3,name:'خوراکی',icon:'🥐'}],
 cafe:[{id:1,name:'قهوه دمی',cat:1,price:85000,desc:'قهوه تازه‌دم با عطر دلنشین',icon:'☕'},{id:2,name:'چای ایرانی',cat:1,price:45000,desc:'چای خوش‌عطر',icon:'🍵'},{id:3,name:'لیموناد',cat:2,price:65000,desc:'نوشیدنی خنک',icon:'🍋'}],
 storeCats:[{id:1,name:'هنرهای دستی',icon:'🎨'},{id:2,name:'هدایا',icon:'🎁'}],
 store:[{id:1,name:'دفتر دست‌ساز',cat:1,price:180000,desc:'دفتر با جلد هنری',icon:'📒'},{id:2,name:'شمع تزئینی',cat:2,price:120000,desc:'ساخته‌شده با دست',icon:'🕯️'}],
 books:[{id:1,title:'سمفونی مردگان',author:'عباس معروفی',type:'loan',price:20000,available:true,icon:'📚',desc:'رمان'},{id:2,title:'انسان در جست‌وجوی معنا',author:'ویکتور فرانکل',type:'sale',price:230000,available:true,icon:'📖',desc:'کتاب فروشی'}],
 events:[{id:1,title:'دورهمی هفتگی سیمرغ',date:'1405/09/01',type:'weekly',capacity:0,desc:'دیدار و گفت‌وگوی اعضا',icon:'🗓️'},{id:2,title:'کارگاه کتاب‌خوانی',date:'1405/09/10',type:'signup',capacity:20,desc:'نشست گروهی کتاب‌خوانی',icon:'📚'}],
 topics:[{id:1,title:'پیشنهاد کتاب برای شروع مطالعه',body:'چه کتابی را برای شروع دوباره مطالعه پیشنهاد می‌کنید؟',author:'مدیر سیمرغ',comments:[{body:'کتاب‌های کوتاه داستانی انتخاب خوبی هستند.',author:'عضو سیمرغ'}]}],
 requests:[],loans:[],registrations:[],notifications:[{id:1,title:'به سیمرغ خوش آمدید',body:'این نسخه نمایشی برای بررسی امکانات اپلیکیشن است.'}],profile:{name:'کاربر نمونه',bio:'عضو کافه‌کتاب سیمرغ',points:120,level:'نقره‌ای',avatar:''}
};
let data;try{data=JSON.parse(localStorage.getItem('simorgh_demo_v2'))||structuredClone(initial)}catch{data=structuredClone(initial)}
let role=localStorage.getItem('simorgh_demo_role')||'user',page='home',tab='all',seq=Date.now();
const save=()=>localStorage.setItem('simorgh_demo_v2',JSON.stringify(data));
const fa=n=>Number(n||0).toLocaleString('fa-IR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navItems=[['home','⌂','خانه'],['cafe','☕','کافه'],['library','▤','کتابخانه'],['events','◷','رویدادها'],['store','✿','فروشگاه'],['forum','◎','تالار'],['profile','♙','پروفایل']];
function renderNav(){$('#nav').innerHTML=navItems.map(([k,i,t])=>'<button class="'+(page===k?'active':'')+'" onclick="go(\''+k+'\')"><i>'+i+'</i>'+t+'</button>').join('')+(role==='admin'?'<button class="'+(page==='admin'?'active':'')+'" onclick="go(\'admin\')"><i>⚙</i>مدیریت</button>':'')}
function go(p){page=p;renderNav();render()}
function card(item,kind){let title=item.name||item.title;return '<article class="card"><div class="cover">'+(item.icon||'✦')+'</div><h3>'+esc(title)+'</h3><p>'+esc(item.desc||item.author||'')+'</p>'+(item.price!=null?'<div class="price">'+fa(item.price)+' تومان</div>':'')+'<div class="actions">'+(kind==='book'?'<button class="btn small" onclick="bookAction('+item.id+')">'+(item.type==='loan'?'درخواست امانت':'درخواست خرید')+'</button>':kind==='event'&&item.type==='signup'?'<button class="btn small" onclick="registerEvent('+item.id+')">ثبت‌نام</button>':'')+'</div></article>'}
function section(title,content,action=''){return '<div class="section-title"><h2>'+title+'</h2>'+action+'</div>'+content}
function render(){const v=$('#view');$('#userBadge').textContent=data.profile.name+' · '+(role==='admin'?'مدیر':'عضو');let h='';
if(page==='home'){h='<section class="hero"><h1>به جهان سیمرغ خوش آمدید</h1><p>جایی برای کتاب، هنر، گفت‌وگو و تجربه‌های فرهنگی. از بخش‌های مختلف دیدن کنید و در برنامه‌های مجموعه همراه شوید.</p><div class="actions"><button class="btn" onclick="go(\'library\')">ورود به کتابخانه</button><button class="btn ghost" onclick="go(\'events\')">رویدادهای پیش‌رو</button></div></section><div class="tiles"><button class="tile" onclick="go(\'cafe\')"><b>☕ کافه</b><span>منو و محصولات کافه</span></button><button class="tile" onclick="go(\'library\')"><b>📚 کتابخانه</b><span>امانی و فروشی</span></button><button class="tile" onclick="go(\'store\')"><b>🎨 فروشگاه سیمرغ</b><span>محصولات هنری</span></button><button class="tile" onclick="go(\'forum\')"><b>💬 تالار سیمرغ</b><span>گفت‌وگو و تبادل نظر</span></button></div>'+section('رویدادهای پیش‌رو','<div class="grid">'+data.events.slice(0,2).map(x=>card(x,'event')).join('')+'</div>')+'<div class="notice">این محیط فعلاً نسخه نمایشی است. اطلاعات در همین مرورگر ذخیره می‌شود و به سرور یا پایگاه داده‌ای ارسال نمی‌شود.</div>'}
if(page==='cafe'){h=section('کافه سیمرغ','<div class="tabs">'+['همه',...data.cafeCats.map(x=>x.name)].map((x,i)=>'<button class="'+((tab==='all'&&i===0)||tab===x?'active':'')+'" onclick="tab=\''+(i===0?'all':x)+'\';render()">'+x+'</button>').join('')+'</div><div class="grid">'+data.cafe.filter(x=>tab==='all'||data.cafeCats.find(c=>c.id===x.cat)?.name===tab).map(x=>card(x,'cafe')).join('')+'</div>');}
if(page==='library'){h='<div class="tabs"><button class="'+(tab==='all'?'active':'')+'" onclick="tab=\'all\';render()">همه کتاب‌ها</button><button class="'+(tab==='loan'?'active':'')+'" onclick="tab=\'loan\';render()">امانی</button><button class="'+(tab==='sale'?'active':'')+'" onclick="tab=\'sale\';render()">فروشی</button></div><div class="grid">'+data.books.filter(x=>tab==='all'||x.type===tab).map(x=>card(x,'book')).join('')+'</div><div class="panel"><h3>درخواست تهیه یا پیشنهاد کتاب</h3><div class="field"><input id="suggestTitle" placeholder="عنوان کتاب"></div><div class="field"><input id="suggestAuthor" placeholder="نویسنده"></div><button class="btn" onclick="suggestBook()">ثبت پیشنهاد</button></div>'}
if(page==='events'){h='<div class="tabs"><button class="active">همه رویدادها</button></div><div class="grid">'+data.events.map(x=>card(x,'event')).join('')+'</div><div class="panel"><h3>ثبت‌نام‌های من</h3>'+(data.registrations.map(x=>'<p>'+esc(x.title)+' · '+esc(x.status)+'</p>').join('')||'<p class="muted">هنوز ثبت‌نامی ندارید.</p>')+'</div>'}
if(page==='store'){h='<div class="tabs">'+['همه',...data.storeCats.map(x=>x.name)].map((x,i)=>'<button class="'+((tab==='all'&&i===0)||tab===x?'active':'')+'" onclick="tab=\''+(i===0?'all':x)+'\';render()">'+x+'</button>').join('')+'</div><div class="grid">'+data.store.filter(x=>tab==='all'||data.storeCats.find(c=>c.id===x.cat)?.name===tab).map(x=>card(x,'store')).join('')+'</div>'}
if(page==='forum'){h=section('تالار گفت‌وگوی سیمرغ',data.topics.map(t=>'<article class="card"><h3>'+esc(t.title)+'</h3><p>'+esc(t.body)+'</p><div class="muted">نویسنده: '+esc(t.author)+'</div>'+t.comments.map(c=>'<div class="notice">'+esc(c.body)+'<br><small>'+esc(c.author)+'</small></div>').join('')+'<div class="field"><input id="reply'+t.id+'" placeholder="دیدگاه شما"></div><button class="btn small" onclick="comment('+t.id+')">ارسال دیدگاه</button></article>').join('')+(role==='admin'?'<button class="btn" onclick="newTopic()">ایجاد موضوع جدید</button>':'<div class="notice">ایجاد موضوع جدید در نسخه نهایی بر اساس مجوز مدیر فعال خواهد شد.</div>'))}
if(page==='profile'){h='<div class="panel"><div class="row"><h2>کارت عضویت سیمرغ</h2><span class="pill">'+esc(data.profile.level)+'</span></div><div class="cover" style="width:110px;height:110px;border-radius:50%">♙</div><h2>'+esc(data.profile.name)+'</h2><p>'+esc(data.profile.bio)+'</p><h2 class="price">'+fa(data.profile.points)+' امتیاز</h2><button class="btn ghost" onclick="editProfile()">ویرایش پروفایل</button></div>'+section('سوابق درخواست‌ها','<p class="muted">درخواست‌های ثبت‌شده: '+fa(data.requests.length+data.loans.length)+'</p>')+section('اعلان‌ها',data.notifications.map(n=>'<div class="notice"><b>'+esc(n.title)+'</b><br>'+esc(n.body)+'</div>').join(''))}
if(page==='admin'){h='<div class="tabs">'+['overview','cafe','store','books','events','requests','forum','users'].map(x=>'<button class="'+(tab===x?'active':'')+'" onclick="tab=\''+x+'\';render()">'+({overview:'نمای کلی',cafe:'کافه',store:'فروشگاه',books:'کتاب‌ها',events:'رویدادها',requests:'درخواست‌ها',forum:'تالار',users:'کاربران'}[x])+'</button>').join('')+'</div>';
if(tab==='overview')h+='<div class="tiles"><div class="tile"><b>'+fa(data.books.length)+'</b><span>کتاب</span></div><div class="tile"><b>'+fa(data.events.length)+'</b><span>رویداد</span></div><div class="tile"><b>'+fa(data.requests.length+data.loans.length)+'</b><span>درخواست</span></div><div class="tile"><b>'+fa(data.topics.length)+'</b><span>موضوع تالار</span></div></div><div class="notice">پنل مدیریتی نمایشی؛ عملیات این صفحه فقط روی داده‌های آزمایشی همین مرورگر اثر می‌گذارد.</div>';
else if(['cafe','store','books','events'].includes(tab)){let arr=tab==='cafe'?data.cafe:tab==='store'?data.store:tab==='books'?data.books:data.events;h+= '<button class="btn" onclick="addItem(\''+tab+'\')">افزودن مورد جدید</button><div class="grid" style="margin-top:12px">'+arr.map(x=>'<div class="card"><h3>'+esc(x.name||x.title)+'</h3><p>'+esc(x.desc||x.author||'')+'</p><div class="actions"><button class="btn small ghost" onclick="editItem(\''+tab+'\','+x.id+')">ویرایش</button><button class="btn small danger" onclick="deleteItem(\''+tab+'\','+x.id+')">حذف</button></div></div>').join('')+'</div>'}
else if(tab==='requests')h+='<div class="grid">'+data.requests.concat(data.loans).map(x=>'<div class="card"><h3>'+esc(x.title)+'</h3><p>'+esc(x.kind)+' · '+esc(x.status)+'</p><button class="btn small" onclick="resolveRequest('+x.id+')">تأیید درخواست</button></div>').join('')+'</div>'||'<div class="empty">درخواستی ثبت نشده است.</div>';
else h+='<div class="notice">مدیریت '+tab+' در نسخه آزمایشی محدود است و در نسخه نهایی به مجوزهای تفکیک‌شده متصل خواهد شد.</div>'}
v.innerHTML=h||'<div class="empty">محتوایی برای نمایش وجود ندارد.</div>';renderNav()}
function toggleRole(){role=role==='admin'?'user':'admin';localStorage.setItem('simorgh_demo_role',role);tab='overview';render()}
function bookAction(id){let b=data.books.find(x=>x.id===id);if(b.type==='loan'){let fee=prompt('مبلغ پیشنهادی امانت (حداقل ۲۰٬۰۰۰ تومان)','20000');if(fee===null)return;if(Number(fee)<20000)return alert('مبلغ کمتر از ۲۰٬۰۰۰ تومان قابل تأیید نیست.');data.loans.push({id:++seq,title:b.title,kind:'امانت',status:'در انتظار بررسی'});}else data.requests.push({id:++seq,title:b.title,kind:'خرید حضوری',status:'ثبت‌شده'});save();alert('درخواست در نسخه نمایشی ثبت شد.');render()}
function registerEvent(id){let e=data.events.find(x=>x.id===id);if(e.type!=='signup')return;let n=prompt('نام و نام خانوادگی ثبت‌نام‌کننده');if(!n)return;let phone=prompt('شماره تماس');if(!phone)return;data.registrations.push({id:++seq,title:e.title,status:'ثبت‌شده',name:n,phone});save();render();alert('ثبت‌نام نمایشی انجام شد.')}
function suggestBook(){let t=$('#suggestTitle').value.trim();if(!t)return alert('عنوان کتاب را وارد کنید');data.requests.push({id:++seq,title:t,kind:'پیشنهاد کتاب',status:'ثبت‌شده'});save();alert('پیشنهاد ثبت شد.');render()}
function comment(id){let e=$('#reply'+id),v=e.value.trim();if(!v)return;e.value='';data.topics.find(t=>t.id===id).comments.push({body:v,author:data.profile.name});save();render()}
function newTopic(){let title=prompt('عنوان موضوع'),body=prompt('متن موضوع');if(!title||!body)return;data.topics.unshift({id:++seq,title,body,author:'مدیر سیمرغ',comments:[]});save();render()}
function editProfile(){let n=prompt('نام نمایشی',data.profile.name),b=prompt('توضیح کوتاه',data.profile.bio);if(n)data.profile.name=n;if(b!==null)data.profile.bio=b;save();render()}
function openForm(title,fields,done,values={}){$('#dialog').innerHTML='<h3>'+title+'</h3>'+fields.map(f=>'<div class="field"><label>'+f.label+'</label><input id="f_'+f.key+'" value="'+esc(values[f.key]??'')+'" placeholder="'+f.label+'"></div>').join('')+'<div class="actions"><button class="btn" id="saveForm">ذخیره</button><button class="btn ghost" onclick="closeModal()">انصراف</button></div>';$('#modal').classList.remove('hidden');$('#saveForm').onclick=()=>{let x={};fields.forEach(f=>x[f.key]=$('#f_'+f.key).value.trim());done(x)}}
function closeModal(){$('#modal').classList.add('hidden')}
const schemas={cafe:[['name','نام محصول'],['price','قیمت'],['desc','توضیح']],store:[['name','نام محصول'],['price','قیمت'],['desc','توضیح']],books:[['title','عنوان کتاب'],['author','نویسنده'],['price','قیمت یا مبلغ امانت']],events:[['title','عنوان رویداد'],['date','تاریخ'],['desc','توضیح']]};
function addItem(k){openForm('افزودن',schemas[k].map(([key,label])=>({key,label})),x=>{let a=k==='cafe'?data.cafe:k==='store'?data.store:k==='books'?data.books:data.events;let obj={id:++seq,...x,price:Number(x.price)||0,icon:k==='books'?'📚':k==='events'?'🗓️':'✦'};if(k==='books'){obj.type='sale';obj.available=true}if(k==='events'){obj.type='signup';obj.capacity=0}a.unshift(obj);save();closeModal();render()})}
function editItem(k,id){let a=k==='cafe'?data.cafe:k==='store'?data.store:k==='books'?data.books:data.events,obj=a.find(x=>x.id===id);openForm('ویرایش',schemas[k].map(([key,label])=>({key,label})),x=>{Object.assign(obj,x);if(x.price)obj.price=Number(x.price)||0;save();closeModal();render()},obj)}
function deleteItem(k,id){if(!confirm('این مورد حذف شود؟'))return;let key=k==='cafe'?'cafe':k==='store'?'store':k==='books'?'books':'events';data[key]=data[key].filter(x=>x.id!==id);save();render()}
function resolveRequest(id){let x=data.requests.concat(data.loans).find(y=>y.id===id);if(x)x.status='تأییدشده';save();render()}
renderNav();render();
</script></body></html>
