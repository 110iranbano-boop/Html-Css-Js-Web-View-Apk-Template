<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b2426">
<title>فرهنگسرای سیمرغ</title>
<link rel="icon" href="img/favicon.png">
<style>
:root{--bg:#0b2426;--s1:#10312f;--s2:#174240;--gold:#d8a84e;--gold2:#f0cf8a;--tx:#f1e8d4;--mu:#9db3ab;--line:rgba(216,168,78,.35);--bad:#e0735d;--ok:#79c79a}
*{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn,Vazir,Tahoma,sans-serif}
body{background:var(--bg) url(img/bg-page.jpg) center top/cover fixed no-repeat;color:var(--tx);min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:rgba(11,36,38,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{flex:1;font-size:18px;color:var(--gold2)}
body[data-pg=home]{background-image:url(img/bg-home.jpg)}
.ic{width:100%;height:100%;display:block}
.ib{position:relative;padding:9px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--s1);font-size:18px;cursor:pointer}
.ib b{position:absolute;top:-3px;left:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);font-size:11px;line-height:18px;text-align:center;padding:0 4px}
main{padding:14px}
.brand{text-align:center;padding:14px 0 4px}
.brand .name{font-size:34px;color:var(--gold2);font-weight:700;letter-spacing:1px}
.brand p{color:var(--gold);font-size:13px;margin-top:2px}
.wheel{position:relative;width:min(92vw,380px);aspect-ratio:1;margin:14px auto;border-radius:50%;border:1.5px solid var(--gold);background:radial-gradient(circle,var(--s2),var(--s1) 70%);box-shadow:0 0 40px rgba(216,168,78,.18) inset,0 10px 30px #0008}
.wheel .core{position:absolute;inset:34%;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;background:var(--bg);box-shadow:0 0 24px rgba(216,168,78,.35)}
.seg{position:absolute;width:27%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;cursor:pointer;text-align:center;line-height:1.3}
.wheel .core img{width:74%}.seg img{width:34px;height:34px}.lg{display:block;margin:0 auto;width:96px;height:96px}
.seg:active{background:var(--s2);border-color:var(--gold)}
.tag{text-align:center;color:var(--gold);font-size:15px;margin-top:8px}
.nav{position:fixed;bottom:0;right:0;left:0;z-index:30;display:flex;background:rgba(11,36,38,.96);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;color:var(--mu);font-size:10.5px;padding:4px 0;cursor:pointer}
.nav button img{display:block;width:24px;height:24px;margin:0 auto 2px;opacity:.5}
.nav button.on{color:var(--gold)}
.nav button.on img{opacity:1;filter:drop-shadow(0 0 6px var(--gold))}
.card{background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{font-size:15.5px;color:var(--gold2);margin-bottom:4px}
.card p,.sub{font-size:12.5px;color:var(--mu);line-height:1.8}
.card img,.ph{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:var(--s1);display:grid;place-items:center;font-size:40px}
.price{color:var(--gold2);font-weight:700;font-size:14px}
.sec{color:var(--gold);font-size:15px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec::before{content:"◆";font-size:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0;padding:10px}.grid .card img,.grid .ph{height:110px}
.btn{width:100%;margin-top:8px;padding:10px;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(180deg,#e8bf6a,#c1902f);color:#1a1405;font-weight:700;cursor:pointer}
.btn.o{background:none;color:var(--gold2)}.btn.r{background:none;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45}.btn.s{width:auto;padding:6px 14px;font-size:12.5px;margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{flex:1;white-space:nowrap;padding:9px 12px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--mu);cursor:pointer}
.tabs button.on{background:linear-gradient(180deg,#e8bf6a,#c1902f);color:#1a1405;font-weight:700;border-color:var(--gold)}
label{display:block;font-size:12.5px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--s1)}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input[type=checkbox]{width:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11.5px;border:1px solid var(--line);color:var(--gold2)}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.no{color:var(--bad);border-color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.menu{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--s1);margin-bottom:10px;width:100%;cursor:pointer;text-align:right}
.menu img{width:26px;height:26px}.menu span{flex:1}
.mc{background:linear-gradient(135deg,#143c3a,#0b2426);border:1.5px solid var(--gold);border-radius:20px;padding:18px;margin-bottom:14px}
.mc .code{letter-spacing:2px;direction:ltr;text-align:right;margin-top:14px;font-size:16px;color:var(--gold2)}
.empty{text-align:center;color:var(--mu);padding:28px 10px;font-size:13.5px}
.modal{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-end}
.modal>div{width:100%;max-height:88vh;overflow:auto;background:var(--bg);border-top:1.5px solid var(--gold);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;bottom:90px;right:50%;transform:translateX(50%);z-index:60;background:var(--gold);color:#1a1405;padding:10px 18px;border-radius:20px;font-size:13.5px;max-width:88vw;text-align:center}
.auth{max-width:420px;margin:0 auto;padding:30px 18px}
@media (prefers-reduced-motion:no-preference){.wheel{animation:fade .6s ease}@keyframes fade{from{opacity:0;transform:scale(.96)}}}
</style>
</head>
<body>
<div id="auth" class="auth hidden"></div>
<div id="app" class="hidden">
  <div class="top">
    <button class="ib" id="back" onclick="go('home')" aria-label="خانه">→</button>
    <h1 id="title"></h1>
    <button class="ib" onclick="go('notifs')" aria-label="اعلان‌ها"><img class="ic" src="img/icons/bell.svg" alt=""><b id="nb" class="hidden"></b></button>
    <button class="ib" onclick="go('cart')" aria-label="سبد خرید"><img class="ic" src="img/icons/cart.svg" alt=""><b id="cb" class="hidden"></b></button>
  </div>
  <main id="main"></main>
  <nav class="nav" id="nav"></nav>
</div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeM()"><div id="mbox"></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="config.js"></script>
<script>
const CFG=window.APP_CONFIG||{},API=(String(CFG.API_BASE||'').trim().replace(/\/+$/,''))||location.origin+'/api';
const $=id=>document.getElementById(id);
const ic=n=>`<img src="img/icons/${n}.svg" alt="">`;
let U=null,page='home',cart=[],libTab='sale',cache={},admTab='purchase';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n).toLocaleString('fa-IR');
const money=n=>n==null||n===''?'قیمت: پس از استعلام':fa(Math.round(n))+' تومان';
const when=d=>d?new Date(d).toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'}):'';
const latin=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
const PST={registered:'ثبت‌شده',reviewing:'در حال بررسی',confirmed:'تأییدشده',awaiting_contact:'در انتظار هماهنگی',ready:'آماده تحویل',shipped:'ارسال‌شده',completed:'تکمیل‌شده',cancelled:'ردشده یا لغوشده'};
const GST={pending:'در انتظار بررسی',approved:'تأیید شد',rejected:'رد شد'};
const badge=(t,c='')=>`<span class="badge ${c}">${esc(t)}</span>`;
const gb=s=>badge(GST[s]||s,s==='approved'?'ok':s==='rejected'?'no':'');
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),3000)}
function openM(h){$('mbox').innerHTML=h;$('modal').classList.remove('hidden')}
function closeM(){$('modal').classList.add('hidden')}
async function api(p,o={}){
  const h={'Content-Type':'application/json'},t=localStorage.getItem('token');if(t)h.Authorization='Bearer '+t;
  let r,d={};
  try{r=await fetch(API+p,{...o,headers:h,signal:AbortSignal.timeout(20000)});d=await r.json().catch(()=>({}))}
  catch{toast('ارتباط با سرور برقرار نشد');return{ok:false,d:{}}}
  if(r.status===401&&t&&!/^\/(login|register)/.test(p)){logout(true);return{ok:false,d}}
  return{ok:r.ok,d}
}
const send=(p,m,b)=>api(p,{method:m,body:b?JSON.stringify(b):undefined});

/* ---------- ورود ---------- */
function showAuth(signup){
  document.body.dataset.pg='home';
  $('app').classList.add('hidden');$('auth').classList.remove('hidden');
  $('auth').innerHTML=`<div class="brand"><img class="lg" style="width:130px;height:130px" src="img/logo-512.png" alt=""><div class="name">سیمرغ</div><p>فرهنگ، هنر، کتاب و تجربه</p></div>
  ${signup?`<label>نام و نام خانوادگی</label><input id="an" autocomplete="name">`:''}
  <label>شمارهٔ همراه</label><input id="ap" type="tel" inputmode="numeric" placeholder="09123456789" style="direction:ltr;text-align:left" autocomplete="tel">
  <label>رمز عبور${signup?' (حداقل ۶ کاراکتر)':''}</label><input id="aw" type="password" autocomplete="${signup?'new-password':'current-password'}">
  <button class="btn" onclick="${signup?'doSignup()':'doLogin()'}">${signup?'ساخت حساب':'ورود'}</button>
  <button class="btn o" onclick="showAuth(${!signup})">${signup?'حساب دارم، ورود':'حساب ندارم، ثبت‌نام'}</button>`;
}
async function doLogin(){
  const phone=latin($('ap').value),password=$('aw').value;
  if(!phone||!password)return toast('شماره و رمز عبور را وارد کنید');
  const{ok,d}=await send('/login','POST',{phone,password});
  if(!ok)return toast(d.error||'ورود انجام نشد');
  localStorage.setItem('token',d.token);localStorage.setItem('user',JSON.stringify(d.user));boot();
}
async function doLogin(){
  const phoneInput = document.getElementById('ap');
  const passInput = document.getElementById('aw');
  
  if(!phoneInput || !passInput) {
      alert("خطای فنی: فیلدهای ورودی پیدا نشدند!");
      return;
  }

  const rawPhone = phoneInput.value;
  const rawPass = passInput.value;

  const phone = latin(rawPhone);
  const password = rawPass;

  if(!phone || !password) return toast('شماره و رمز عبور را وارد کنید');
  
  const{ok,d}=await send('/login','POST',{phone,password});
  
  if(!ok) {
      // این خط را تغییر دادیم تا دقیقاً جواب سرور را ببینیم
      alert("خطای سرور: " + (d.error || JSON.stringify(d) || "خطای ناشناخته"));
      return;
  }
  
  localStorage.setItem('token',d.token);localStorage.setItem('user',JSON.stringify(d.user));boot();
}
/* ---------- راه‌اندازی و ناوبری ---------- */
function boot(){
  try{U=JSON.parse(localStorage.getItem('user')||'null')}catch{U=null}
  if(!U||!localStorage.getItem('token'))return showAuth(false);
  try{cart=JSON.parse(localStorage.getItem('cart_'+U.id)||'[]')}catch{cart=[]}
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  const N=[['home','home','خانه'],['library','library','کتابخانه'],['events','events','رویدادها'],['art','art','گالری هنری'],['cafe','cafe','کافه'],['account','account','حساب']];
  $('nav').innerHTML=N.map(([k,i,t])=>`<button data-k="${k}" onclick="go('${k}')">${ic(i)}${t}</button>`).join('');
  go('home');refreshBadges();
}
const TITLES={home:'سیمرغ',cafe:'کافه‌کتاب',library:'کتابخانه',events:'رویدادها',art:'گالری هنری سیمرغ',cart:'سبد خرید',account:'حساب کاربری',notifs:'اعلان‌ها',mine:'درخواست‌های من',admin:'پنل مدیریت'};
async function go(p,arg){
  page=p;document.body.dataset.pg=p;if(p==='library'&&arg)libTab=arg;
  $('title').textContent=TITLES[p];$('back').classList.toggle('hidden',p==='home');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===p));
  $('main').innerHTML='<div class="empty">در حال بارگذاری…</div>';scrollTo(0,0);
  await R[p]();
}
function saveCart(){localStorage.setItem('cart_'+U.id,JSON.stringify(cart));refreshBadges()}
async function refreshBadges(){
  const n=cart.reduce((s,i)=>s+i.qty,0);$('cb').textContent=fa(n);$('cb').classList.toggle('hidden',!n);
  const{ok,d}=await api('/notifications');const u=ok?d.filter(x=>!x.is_read).length:0;
  $('nb').textContent=fa(u);$('nb').classList.toggle('hidden',!u);
}
const img=(u,i)=>u?`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph>${i}</div>'">`:`<div class="ph">${i}</div>`;
const list=(a,empty)=>a.length?a:`<div class="empty">${empty}</div>`;

/* ---------- صفحه‌ها ---------- */
const R={
home(){
  const S=[['cafe','cafe','کافه‌کتاب'],['library','library','کتابخانه'],['events','events','رویدادها'],['art','art','گالری هنری'],['cart','cart','سبد خرید'],['request','request','درخواست کتاب'],['account','account','حساب کاربری']];
  const seg=S.map(([k,i,t],n)=>{const a=n*2*Math.PI/7-Math.PI/2;
    return `<button class="seg" style="left:${50-37*Math.cos(a)}%;top:${50+37*Math.sin(a)}%" onclick="${k==='request'?"go('library','request')":`go('${k}')`}">${ic(i)}${t}</button>`}).join('');
  $('main').innerHTML=`<div class="brand"><img class="lg" src="img/logo-512.png" alt=""><div class="name">سیمرغ</div><p>فرهنگ، هنر، کتاب و تجربه</p></div>
  <div class="wheel"><div class="core"><img src="img/logo-512.png" alt=""></div>${seg}</div><div class="tag">جایی برای رویاها، کتاب‌ها و هنر…</div>`;
},
async cafe(){
  const{ok,d}=await api('/menu');if(!ok)return $('main').innerHTML='<div class="empty">منو بارگذاری نشد</div>';
  const cats=[...new Set(d.map(i=>i.category||'سایر'))];
  $('main').innerHTML=cats.map(c=>`<div class="sec">${esc(c)}</div>`+d.filter(i=>(i.category||'سایر')===c).map(i=>`
    <div class="card">${i.image_url?img(i.image_url,'☕'):''}<div class="row"><h3>${esc(i.name)}</h3><span class="price">${money(i.price)}</span></div>${i.description?`<p>${esc(i.description)}</p>`:''}</div>`).join('')).join('')||'<div class="empty">منو هنوز ثبت نشده است</div>';
  /* کافه فقط نمایش منو است؛ دکمهٔ سفارش یا سبد وجود ندارد */
},
async library(){
  const[b,l]=await Promise.all([api('/books'),api('/loan-requests/my')]);
  if(!b.ok)return $('main').innerHTML='<div class="empty">بارگذاری نشد</div>';
  cache.books=b.d;const pend=new Set((l.ok?l.d:[]).filter(x=>x.status==='pending').map(x=>x.book_id));
  const T=[['sale','فروش کتاب'],['loan','امانی'],['request','درخواست کتاب']];
  let body='';
  if(libTab==='sale')body=b.d.filter(x=>x.type==='sale').map(x=>`<div class="card"><div class="row"><h3>${esc(x.title)}</h3><span class="price">${money(x.price)}</span></div><p>${esc(x.author||'')}${x.category?' · '+esc(x.category):''}</p>${x.description?`<p>${esc(x.description)}</p>`:''}<button class="btn s" onclick="addCart('book',${x.id})">افزودن به سبد</button></div>`).join('')||'<div class="empty">کتابی برای فروش ثبت نشده است</div>';
  if(libTab==='loan')body=b.d.filter(x=>x.type==='loan').map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.author||'')}</p>${x.description?`<p>${esc(x.description)}</p>`:''}${x.status!=='available'?badge('امانت داده شده','no'):pend.has(x.id)?badge('درخواست شما در حال بررسی است'):`<button class="btn s" onclick="reqLoan(${x.id})">درخواست امانت</button>`}</div>`).join('')||'<div class="empty">کتاب امانی ثبت نشده است</div>';
  if(libTab==='request'){
    const r=await api('/book-requests/my');
    body=`<div class="card"><h3>کتابی می‌خواهید که در سیمرغ نیست؟</h3><label>عنوان کتاب</label><input id="rt"><label>نویسنده یا ناشر (اختیاری)</label><input id="ra"><label>توضیح (اختیاری)</label><textarea id="rd" rows="2"></textarea><button class="btn" onclick="sendBookReq()">ارسال درخواست</button></div>
    <div class="sec">درخواست‌های کتاب من</div>`+((r.ok?r.d:[]).map(x=>`<div class="card"><h3>${esc(x.book_title)}</h3><p>${esc(x.author||'')}</p>${gb(x.status)}${x.admin_note?`<p>پاسخ مدیریت: ${esc(x.admin_note)}</p>`:''}</div>`).join('')||'<div class="empty">هنوز درخواستی ثبت نکرده‌اید</div>');
  }
  $('main').innerHTML=`<div class="tabs">${T.map(([k,t])=>`<button class="${k===libTab?'on':''}" onclick="go('library','${k}')">${t}</button>`).join('')}</div>`+body;
},
async events(){
  const{ok,d}=await api('/events');if(!ok)return $('main').innerHTML='<div class="empty">بارگذاری نشد</div>';
  $('main').innerHTML=d.map(e=>{const full=e.capacity&&e.registered>=e.capacity;
    return `<div class="card">${e.image_url?img(e.image_url,'📅'):''}<h3>${esc(e.title)}</h3><p>📅 ${when(e.event_date)}${e.location?' · 📍 '+esc(e.location):''}</p>${e.description?`<p>${esc(e.description)}</p>`:''}${e.capacity?`<p>ظرفیت: ${fa(e.registered)} از ${fa(e.capacity)}</p>`:''}
    ${e.mine?`${badge('ثبت‌نام شده‌اید','ok')}<button class="btn r s" style="margin-inline-start:8px" onclick="unreg(${e.id})">لغو ثبت‌نام</button>`:!e.registration_open?badge('ثبت‌نام بسته است','no'):full?badge('ظرفیت تکمیل است','no'):`<button class="btn" onclick="reg(${e.id})">ثبت‌نام در رویداد</button>`}</div>`}).join('')||'<div class="empty">رویداد فعالی نیست</div>';
},
async art(){
  const{ok,d}=await api('/art');if(!ok)return $('main').innerHTML='<div class="empty">بارگذاری نشد</div>';
  cache.art=d;const cats=['همه',...new Set(d.map(i=>i.category).filter(Boolean))],cur=cache.artCat||'همه';
  const SL={in_stock:'موجود',made_to_order:'ساخت بر اساس سفارش',out:'ناموجود'};
  $('main').innerHTML=`<div class="tabs">${cats.map(c=>`<button class="${c===cur?'on':''}" onclick="cache.artCat='${esc(c).replace(/'/g,'')}';go('art')">${esc(c)}</button>`).join('')}</div><div class="grid">`+
   d.filter(i=>cur==='همه'||i.category===cur).map(i=>`<div class="card">${img(i.image_url,'🎨')}<h3>${esc(i.name)}</h3><div class="price">${money(i.price)}</div><p>${SL[i.stock_status]}${i.allow_custom?' · سفارشی‌سازی':''}</p><button class="btn s" ${i.stock_status==='out'?'disabled':''} onclick="addCart('art',${i.id})">افزودن به سبد</button></div>`).join('')+'</div>';
},
cart(){
  if(!cart.length)return $('main').innerHTML='<div class="empty">سبد خرید خالی است.<br>کتاب فروشی یا محصول گالری را به سبد اضافه کنید.</div>';
  const tot=cart.reduce((s,i)=>s+(i.price||0)*i.qty,0);
  $('main').innerHTML=cart.map((i,n)=>`<div class="card"><div class="row"><h3>${esc(i.title)}</h3>${badge(i.type==='book'?'کتاب':'گالری')}</div><div class="row"><span class="price">${money(i.price)}</span>
    <span><button class="btn o s" onclick="qty(${n},-1)">−</button> <b>${fa(i.qty)}</b> <button class="btn o s" onclick="qty(${n},1)">+</button></span></div>
    <input placeholder="توضیح یا ویژگی سفارش (اختیاری)" value="${esc(i.note||'')}" onchange="cart[${n}].note=this.value;saveCart()" style="margin-top:8px"></div>`).join('')+
  `<div class="card"><div class="row"><span>جمع مبلغ اعلامی</span><span class="price">${fa(tot)} تومان</span></div><p>مبلغ نهایی و نحوهٔ تحویل پس از بررسی، تلفنی هماهنگ می‌شود.</p>
  <label>شمارهٔ تماس</label><input id="cp" type="tel" inputmode="numeric" value="${esc(U.phone||'')}" style="direction:ltr;text-align:left">
  <label>توضیحات (اختیاری)</label><textarea id="cn" rows="2"></textarea>
  <button class="btn" onclick="submitCart()">ثبت درخواست خرید</button><p style="margin-top:6px">پرداخت اینترنتی در برنامه انجام نمی‌شود؛ این فقط ثبت درخواست است.</p></div>`;
},
account(){
  $('main').innerHTML=`<div class="mc"><div class="row"><b style="font-size:18px">${esc(U.full_name)}</b>${badge(U.role==='admin'?'مدیر':'عضو')}</div><p>${esc(U.phone)}</p><div style="margin-top:10px;color:var(--gold);font-size:15px">اهالی سیمرغ · فرهنگسرای سیمرغ</div><div class="code">${esc(U.member_code||'')}</div></div>
  <button class="menu" onclick="editProfile()">${ic("account")}<span>مشخصات کاربری</span>‹</button>
  <button class="menu" onclick="go('mine')">${ic("receipt")}<span>درخواست‌های من</span>‹</button>
  <button class="menu" onclick="go('notifs')">${ic("bell")}<span>اعلان‌ها</span>‹</button>
  ${U.role==='admin'?`<button class="menu" onclick="go('admin')">${ic("settings")}<span>پنل مدیریت</span>‹</button>`:''}
  <button class="btn r" onclick="logout()">خروج از حساب</button>`;
},
async mine(){
  const[p,l,b,e]=await Promise.all([api('/purchase-requests/my'),api('/loan-requests/my'),api('/book-requests/my'),api('/events')]);
  const reg=(e.ok?e.d:[]).filter(x=>x.mine);
  $('main').innerHTML=`<div class="sec">درخواست‌های خرید</div>`+((p.ok?p.d:[]).map(r=>`<div class="card"><div class="row"><h3>درخواست ${fa(r.id)}</h3>${badge(PST[r.status])}</div>${r.items.map(i=>`<p>${esc(i.title)} × ${fa(i.qty)}</p>`).join('')}${r.final_price!=null?`<p>مبلغ نهایی: ${money(r.final_price)}</p>`:''}${r.admin_note?`<p>پیام مدیریت: ${esc(r.admin_note)}</p>`:''}<p>${when(r.created_at)}</p></div>`).join('')||'<div class="empty">موردی نیست</div>')+
  `<div class="sec">امانت کتاب</div>`+((l.ok?l.d:[]).map(r=>`<div class="card"><h3>${esc(r.book_title)}</h3>${gb(r.status)}</div>`).join('')||'<div class="empty">موردی نیست</div>')+
  `<div class="sec">درخواست کتاب</div>`+((b.ok?b.d:[]).map(r=>`<div class="card"><h3>${esc(r.book_title)}</h3>${gb(r.status)}</div>`).join('')||'<div class="empty">موردی نیست</div>')+
  `<div class="sec">رویدادهای ثبت‌نام‌شده</div>`+(reg.map(r=>`<div class="card"><h3>${esc(r.title)}</h3><p>${when(r.event_date)}</p></div>`).join('')||'<div class="empty">موردی نیست</div>');
},
async notifs(){
  const{ok,d}=await api('/notifications');
  $('main').innerHTML=(ok?d:[]).map(n=>`<div class="card" style="${n.is_read?'':'border-color:var(--gold)'}"><h3>${esc(n.title)}</h3><p>${esc(n.body||'')}</p><p>${when(n.created_at)}</p></div>`).join('')||'<div class="empty">اعلانی ندارید</div>';
  if(ok&&d.some(n=>!n.is_read)){await send('/notifications/read','PUT');refreshBadges()}
},
async admin(){
  const T=[['purchase','خرید'],['loan','امانت'],['breq','درخواست کتاب'],['menu','منوی کافه'],['books','کتاب‌ها'],['art','گالری'],['events','رویدادها']];
  const head=`<div class="tabs">${T.map(([k,t])=>`<button class="${k===admTab?'on':''}" onclick="admTab='${k}';go('admin')">${t}</button>`).join('')}</div>`;
  let body='';
  if(admTab==='purchase'){const{d=[]}=await api('/admin/purchase-requests');
    body=d.map(r=>`<div class="card"><div class="row"><h3>${esc(r.full_name)}</h3><a class="badge" href="tel:${esc(r.contact_phone)}">📞 ${esc(r.contact_phone)}</a></div>${r.items.map(i=>`<p>${esc(i.title)} × ${fa(i.qty)} — ${money(i.price)}${i.note?' ('+esc(i.note)+')':''}</p>`).join('')}${r.note?`<p>توضیح کاربر: ${esc(r.note)}</p>`:''}
    <select onchange="send('/admin/purchase-requests/${r.id}','PUT',{status:this.value}).then(x=>toast(x.ok?'وضعیت تغییر کرد':'خطا'))">${Object.entries(PST).map(([k,t])=>`<option value="${k}" ${k===r.status?'selected':''}>${t}</option>`).join('')}</select>
    <input placeholder="مبلغ نهایی (تومان)" inputmode="numeric" value="${r.final_price??''}" onchange="send('/admin/purchase-requests/${r.id}','PUT',{final_price:latin(this.value)}).then(x=>toast(x.ok?'ذخیره شد':'خطا'))" style="margin-top:6px">
    <input placeholder="پیام برای کاربر" value="${esc(r.admin_note||'')}" onchange="send('/admin/purchase-requests/${r.id}','PUT',{admin_note:this.value}).then(x=>toast(x.ok?'ذخیره شد':'خطا'))" style="margin-top:6px"></div>`).join('')||'<div class="empty">درخواستی نیست</div>'}
  else if(admTab==='loan'){const{d=[]}=await api('/admin/loan-requests');
    body=d.map(r=>`<div class="card"><h3>${esc(r.book_title)}</h3><p>${esc(r.full_name)} · ${esc(r.phone)}</p>${r.status==='pending'?`<button class="btn s" onclick="loanSt(${r.id},'approved')">تأیید</button> <button class="btn r s" onclick="loanSt(${r.id},'rejected')">رد</button>`:gb(r.status)}</div>`).join('')+
    `<div class="sec">بازگشت کتاب</div><p class="sub">برای ثبت بازگشت کتاب، تب «کتاب‌ها» را باز کنید.</p>`||'';}
  else if(admTab==='breq'){const{d=[]}=await api('/admin/book-requests');
    body=d.map(r=>`<div class="card"><h3>${esc(r.book_title)}</h3><p>${esc(r.author||'')} — ${esc(r.full_name)} · ${esc(r.phone)}</p>${r.description?`<p>${esc(r.description)}</p>`:''}
    <select onchange="send('/admin/book-requests/${r.id}','PUT',{status:this.value}).then(x=>toast(x.ok?'ثبت شد':'خطا'))">${Object.entries(GST).map(([k,t])=>`<option value="${k}" ${k===r.status?'selected':''}>${t}</option>`).join('')}</select>
    <input placeholder="نتیجهٔ بررسی برای کاربر" value="${esc(r.admin_note||'')}" onchange="send('/admin/book-requests/${r.id}','PUT',{admin_note:this.value}).then(x=>toast(x.ok?'ذخیره شد':'خطا'))" style="margin-top:6px"></div>`).join('')||'<div class="empty">درخواستی نیست</div>'}
  else{const{d=[]}=await api('/admin/'+admTab);cache['adm_'+admTab]=d;const nm=i=>i.name||i.title;
    body=`<button class="btn" onclick="admForm('${admTab}')">+ افزودن</button>`+d.map(i=>`<div class="card" style="margin-top:10px;${i.active?'':'opacity:.5'}"><div class="row"><h3>${esc(nm(i))}</h3>${i.active?'':badge('غیرفعال','no')}</div>
    <button class="btn o s" onclick="admForm('${admTab}',${i.id})">ویرایش</button> ${admTab==='books'&&i.type==='loan'&&i.status==='loaned'?`<button class="btn s" onclick="send('/admin/books/${i.id}/return','PUT').then(()=>go('admin'))">ثبت بازگشت</button>`:''}
    ${admTab==='events'?`<button class="btn o s" onclick="regs(${i.id})">ثبت‌نام‌شده‌ها</button>`:''} ${i.active?`<button class="btn r s" onclick="admOff('${admTab}',${i.id})">غیرفعال</button>`:''}</div>`).join('')}
  $('main').innerHTML=head+body;
}};

/* ---------- عملیات ---------- */
function addCart(type,id){
  const src=type==='book'?cache.books:cache.art,it=src.find(x=>x.id===id),ex=cart.find(c=>c.type===type&&c.id===id);
  if(ex)ex.qty++;else cart.push({type,id,title:it.title||it.name,price:it.price,qty:1,note:''});
  saveCart();toast('به سبد اضافه شد');
}
function qty(n,d){cart[n].qty+=d;if(cart[n].qty<1)cart.splice(n,1);saveCart();R.cart()}
async function submitCart(){
  const{ok,d}=await send('/purchase-requests','POST',{items:cart.map(({type,id,qty,note})=>({type,id,qty,note})),contact_phone:latin($('cp').value),note:$('cn').value});
  if(!ok)return toast(d.error||'ثبت نشد');
  cart=[];saveCart();toast('درخواست خرید ثبت شد؛ مدیریت با شما تماس می‌گیرد');go('mine');
}
async function reqLoan(id){const{ok,d}=await send('/loan-requests','POST',{book_id:id});toast(ok?'درخواست امانت ثبت شد':d.error);if(ok)go('library')}
async function sendBookReq(){
  const book_title=$('rt').value.trim();if(!book_title)return toast('عنوان کتاب را وارد کنید');
  const{ok,d}=await send('/book-requests','POST',{book_title,author:$('ra').value,description:$('rd').value});
  toast(ok?'درخواست ثبت شد':d.error);if(ok)go('library','request');
}
async function reg(id){const{ok,d}=await send(`/events/${id}/register`,'POST');toast(ok?'ثبت‌نام انجام شد':d.error);go('events')}
async function unreg(id){const{ok}=await send(`/events/${id}/register`,'DELETE');toast(ok?'ثبت‌نام لغو شد':'خطا');go('events')}
function editProfile(){openM(`<h3 style="color:var(--gold2)">مشخصات کاربری</h3><label>نام و نام خانوادگی</label><input id="pn" value="${esc(U.full_name)}"><label>شمارهٔ همراه</label><input value="${esc(U.phone)}" disabled style="direction:ltr;text-align:left"><button class="btn" onclick="saveProfile()">ذخیره</button><button class="btn o" onclick="closeM()">بستن</button>`)}
async function saveProfile(){const{ok,d}=await send('/profile','PUT',{full_name:$('pn').value});if(!ok)return toast(d.error||'خطا');U=d;localStorage.setItem('user',JSON.stringify(U));closeM();go('account')}
async function loanSt(id,status){const{ok,d}=await send('/admin/loan-requests/'+id,'PUT',{status});toast(ok?'ثبت شد':d.error);go('admin')}
async function admOff(r,id){if(!confirm('این مورد غیرفعال شود؟'))return;await send(`/admin/${r}/${id}`,'DELETE');go('admin')}
async function regs(id){const{d=[]}=await api(`/admin/events/${id}/registrations`);openM(`<h3 style="color:var(--gold2)">ثبت‌نام‌شده‌ها (${fa(d.length)})</h3>`+(d.map(r=>`<p class="sub">${esc(r.full_name)} · ${esc(r.phone)}</p>`).join('')||'<div class="empty">کسی ثبت‌نام نکرده</div>')+`<button class="btn o" onclick="closeM()">بستن</button>`)}
const F={ /* [کلید، برچسب، نوع، الزامی/گزینه‌ها] */
 menu:[['name','نام','t',1],['category','دسته (مثلاً قهوه، دسر)'],['description','توضیح','a'],['price','قیمت (تومان)','n'],['image_url','آدرس تصویر'],['sort','ترتیب نمایش','n']],
 books:[['title','عنوان','t',1],['author','نویسنده'],['category','دسته'],['description','توضیح','a'],['type','نوع','s',{loan:'امانی',sale:'فروشی'}],['price','قیمت (تومان، برای فروشی)','n'],['status','وضعیت','s',{available:'موجود',loaned:'امانت داده شده'}],['image_url','آدرس تصویر']],
 art:[['name','نام','t',1],['category','دسته (رزین، شمع، ویترای…)'],['description','توضیح','a'],['price','قیمت (تومان)','n'],['stock_status','موجودی','s',{in_stock:'موجود',made_to_order:'ساخت بر اساس سفارش',out:'ناموجود'}],['allow_custom','امکان سفارشی‌سازی','b'],['image_url','آدرس تصویر']],
 events:[['title','عنوان','t',1],['description','توضیح','a'],['event_date','زمان','d'],['location','مکان'],['capacity','ظرفیت (خالی = نامحدود)','n'],['registration_open','ثبت‌نام باز باشد','b'],['image_url','آدرس تصویر']]};
function admForm(r,id){
  const it=id?cache['adm_'+r].find(x=>x.id===id):{registration_open:true,type:'loan',status:'available',stock_status:'in_stock'};
  const dt=v=>v?new Date(new Date(v).getTime()-new Date(v).getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
  openM(`<h3 style="color:var(--gold2)">${id?'ویرایش':'افزودن'}</h3>`+F[r].map(([k,l,t,o])=>{const v=it[k]??'';
    return t==='b'?`<label><input type="checkbox" id="f_${k}" ${v?'checked':''}> ${l}</label>`:`<label>${l}</label>`+(t==='a'?`<textarea id="f_${k}" rows="2">${esc(v)}</textarea>`:t==='s'?`<select id="f_${k}">${Object.entries(o).map(([a,b])=>`<option value="${a}" ${a===v?'selected':''}>${b}</option>`).join('')}</select>`:`<input id="f_${k}" type="${t==='d'?'datetime-local':'text'}" ${t==='n'?'inputmode="numeric"':''} value="${esc(t==='d'?dt(v):v)}">`)}).join('')+
  `<button class="btn" onclick="admSave('${r}',${id||0})">ذخیره</button><button class="btn o" onclick="closeM()">بستن</button>`);
}
async function admSave(r,id){
  const b={};
  for(const [k,,t,o] of F[r]){const e=$('f_'+k);let v=t==='b'?e.checked:e.value.trim();
    if(t==='n')v=latin(v);if(t==='d'&&v)v=new Date(v).toISOString();
    if(o===1&&!v)return toast('فیلدهای الزامی را پر کنید');b[k]=v}
  if(id)b.active=true;
  const{ok,d}=await send(id?`/admin/${r}/${id}`:`/admin/${r}`,id?'PUT':'POST',b);
  if(!ok)return toast(d.error||'ذخیره نشد');closeM();toast('ذخیره شد');go('admin');
}
boot();
</script>
</body>
</html>
