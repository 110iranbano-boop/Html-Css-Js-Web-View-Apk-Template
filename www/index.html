<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b2426">
<title>کافه‌کتاب سیمرغ</title>
<link rel="icon" href="img/favicon.png">
<style>
:root{--bg:#0b2426;--s1:#10312f;--s2:#174240;--gold:#d8a84e;--gold2:#f0cf8a;--tx:#f1e8d4;--mu:#9db3ab;--line:rgba(216,168,78,.35);--bad:#e0735d;--ok:#79c79a}
*{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn,Vazir,Tahoma,sans-serif}
body{background:var(--bg) url(img/bg-page.jpg) center top/cover fixed no-repeat;color:var(--tx);min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:rgba(11,36,38,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{flex:1;font-size:18px;color:var(--gold2)}
body[data-pg=home]{background-image:url(img/bg-home.jpg)}
.ic{width:100%;height:100%;display:block}
.ib{position:relative;padding:9px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--s1);font-size:18px;cursor:pointer}
.ib b{position:absolute;top:-3px;left:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);font-size:11px;line-height:18px;text-align:center;padding:0 4px}
main{padding:14px}
.brand{text-align:center;padding:14px 0 4px}
.brand .name{font-size:34px;color:var(--gold2);font-weight:700;letter-spacing:1px}
.brand p{color:var(--gold);font-size:13px;margin-top:2px}
.wheel{position:relative;width:min(92vw,380px);aspect-ratio:1;margin:14px auto;border-radius:50%;border:1.5px solid var(--gold);background:radial-gradient(circle,var(--s2),var(--s1) 70%);box-shadow:0 0 40px rgba(216,168,78,.18) inset,0 10px 30px #0008}
.wheel .core{position:absolute;inset:34%;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;background:var(--bg);box-shadow:0 0 24px rgba(216,168,78,.35)}
.seg{position:absolute;width:27%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;cursor:pointer;text-align:center;line-height:1.3}
.wheel .core img{width:74%}.seg img{width:34px;height:34px}.lg{display:block;margin:0 auto;width:96px;height:96px}
.seg:active{background:var(--s2);border-color:var(--gold)}
.tag{text-align:center;color:var(--gold);font-size:15px;margin-top:8px}
.nav{position:fixed;bottom:0;right:0;left:0;z-index:30;display:flex;background:rgba(11,36,38,.96);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;color:var(--mu);font-size:10.5px;padding:4px 0;cursor:pointer}
.nav button img{display:block;width:24px;height:24px;margin:0 auto 2px;opacity:.5}
.nav button.on{color:var(--gold)}
.nav button.on img{opacity:1;filter:drop-shadow(0 0 6px var(--gold))}
.card{background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{font-size:15.5px;color:var(--gold2);margin-bottom:4px}
.card p,.sub{font-size:12.5px;color:var(--mu);line-height:1.8}
.card img,.ph{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:var(--s1);display:grid;place-items:center;font-size:40px}
.price{color:var(--gold2);font-weight:700;font-size:14px}
.sec{color:var(--gold);font-size:15px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec::before{content:"◆";font-size:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0;padding:10px}.grid .card img,.grid .ph{height:110px}
.btn{width:100%;margin-top:8px;padding:10px;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(180deg,#e8bf6a,#c1902f);color:#1a1405;font-weight:700;cursor:pointer}
.btn.o{background:none;color:var(--gold2)}.btn.r{background:none;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45}.btn.s{width:auto;padding:6px 14px;font-size:12.5px;margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{flex:1;white-space:nowrap;padding:9px 12px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--mu);cursor:pointer}
.tabs button.on{background:linear-gradient(180deg,#e8bf6a,#c1902f);color:#1a1405;font-weight:700;border-color:var(--gold)}
label{display:block;font-size:12.5px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--s1)}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input[type=checkbox]{width:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11.5px;border:1px solid var(--line);color:var(--gold2)}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.no{color:var(--bad);border-color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.menu{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--s1);margin-bottom:10px;width:100%;cursor:pointer;text-align:right}
.menu img{width:26px;height:26px}.menu span{flex:1}
.mc{background:linear-gradient(135deg,#143c3a,#0b2426);border:1.5px solid var(--gold);border-radius:20px;padding:18px;margin-bottom:14px}
.mc .code{letter-spacing:2px;direction:ltr;text-align:right;margin-top:14px;font-size:16px;color:var(--gold2)}
.empty{text-align:center;color:var(--mu);padding:28px 10px;font-size:13.5px}
.modal{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-end}
.modal>div{width:100%;max-height:88vh;overflow:auto;background:var(--bg);border-top:1.5px solid var(--gold);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;bottom:90px;right:50%;transform:translateX(50%);z-index:60;background:var(--gold);color:#1a1405;padding:10px 18px;border-radius:20px;font-size:13.5px;max-width:88vw;text-align:center}
.auth{max-width:420px;margin:0 auto;padding:30px 18px}
.user-pill{display:flex;align-items:center;gap:6px;max-width:118px;min-width:0;padding:4px 7px;border:1px solid var(--line);border-radius:22px;background:var(--s1);cursor:pointer;font-size:11px;color:var(--gold2)}
.user-pill img{width:28px;height:28px;border-radius:50%;object-fit:cover}.user-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.suspension-dot{display:inline-block;width:8px;height:8px;min-width:8px;border-radius:50%;background:#e4c52c}.user-pill .suspension-dot{margin-inline-start:2px}
@media (prefers-reduced-motion:no-preference){.wheel{animation:fade .6s ease}@keyframes fade{from{opacity:0;transform:scale(.96)}}}
</style>
</head>
<body>
<div id="auth" class="auth hidden"></div>
<div id="app" class="hidden">
  <div class="top">
    <button class="ib" id="back" onclick="go('home')" aria-label="خانه">→</button>
    <h1 id="title"></h1>
    <button class="user-pill" id="userCard" onclick="go(&quot;account&quot;)" aria-label="پروفایل"></button>
    <button class="ib" onclick="go('notifs')" aria-label="اعلان‌ها"><img class="ic" src="img/icons/bell.svg" alt=""><b id="nb" class="hidden"></b></button>
    <button class="ib" onclick="go('cart')" aria-label="سبد خرید"><img class="ic" src="img/icons/cart.svg" alt=""><b id="cb" class="hidden"></b></button>
  </div>
  <main id="main"></main>
  <nav class="nav" id="nav"></nav>
</div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeM()"><div id="mbox"></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
const CFG=window.APP_CONFIG||{},API=(String(CFG.API_BASE||'').trim().replace(/\/+$/,''))||location.origin+'/api';
const $=id=>document.getElementById(id);
const ic=n=>`<img src="img/icons/${n}.svg" alt="">`;
let U=null,page='home',cart=[],libTab='sale',cache={},admTab='purchase';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n).toLocaleString('fa-IR');
const money=n=>n==null||n===''?'قیمت: پس از استعلام':fa(Math.round(n))+' تومان';
const when=d=>d?new Date(d).toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'}):'';
const latin=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
const PST={registered:'ثبت‌شده',reviewing:'در حال بررسی',confirmed:'تأییدشده',awaiting_contact:'در انتظار هماهنگی',ready:'آماده تحویل',shipped:'ارسال‌شده',completed:'تکمیل‌شده',cancelled:'ردشده یا لغوشده'};
const GST={pending:'در انتظار بررسی',approved:'تأیید شد',rejected:'رد شد'};
const badge=(t,c='')=>`<span class="badge ${c}">${esc(t)}</span>`;
const gb=s=>badge(GST[s]||s,s==='approved'?'ok':s==='rejected'?'no':'');
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),3000)}
function openM(h){$('mbox').innerHTML=h;$('modal').classList.remove('hidden')}
function closeM(){$('modal').classList.add('hidden')}
async function api(p,o={}){
  if(!window.SimorghDB?.ready){toast('اتصال Supabase آماده نیست');return{ok:false,d:{error:'تنظیمات Supabase را بررسی کنید'}}}
  return window.SimorghDB.api(p,o);
}
const send=(p,m,b)=>api(p,{method:m,body:b?JSON.stringify(b):undefined});

/* ---------- ورود و ثبت‌نام ---------- */
function showAuth(signup){
  document.body.dataset.pg='home';
  $('app').classList.add('hidden');$('auth').classList.remove('hidden');
  $('auth').innerHTML=`<div class="brand"><img class="lg" style="width:130px;height:130px" src="img/logo-512.png" alt=""><div class="name">سیمرغ</div><p>فرهنگ، هنر، کتاب و تجربه</p></div>
  ${signup?`<label>نام و نام خانوادگی</label><input id="an" autocomplete="name">`:''}
  <label>شمارهٔ همراه</label><input id="ap" type="tel" inputmode="numeric" placeholder="09123456789" style="direction:ltr;text-align:left" autocomplete="tel">
  <label>رمز عبور${signup?' (حداقل ۶ کاراکتر)':''}</label><input id="aw" type="password" autocomplete="${signup?'new-password':'current-password'}">
  <button class="btn" id="authSubmit" onclick="${signup?'doSignup()':'doLogin()'}">${signup?'ساخت حساب':'ورود'}</button>
  <button class="btn o" onclick="showAuth(${!signup})">${signup?'حساب دارم، ورود':'حساب ندارم، ثبت‌نام'}</button>`;
}
async function doLogin(){
  const phoneInput=$('ap'),passInput=$('aw'),button=$('authSubmit');
  if(!phoneInput||!passInput)return toast('فرم ورود پیدا نشد؛ صفحه را دوباره باز کنید');
  const phone=latin(phoneInput.value),password=passInput.value;
  if(!phone||!password)return toast('شماره همراه و رمز عبور را وارد کنید');
  if(!/^09\d{9}$/.test(phone))return toast('شماره همراه باید ۱۱ رقم و با 09 شروع شود');
  if(button)button.disabled=true;
  const{ok,d}=await send('/login','POST',{phone,password});
  if(button)button.disabled=false;
  if(!ok)return toast(d.error||'ورود انجام نشد؛ اتصال سرور را بررسی کنید');
  if(!d.token||!d.user)return toast('پاسخ سرور برای ورود معتبر نیست');
  localStorage.setItem('token',d.token);
  localStorage.setItem('user',JSON.stringify(d.user));
  boot();
}
async function doSignup(){
  const nameInput=$('an'),phoneInput=$('ap'),passInput=$('aw'),button=$('authSubmit');
  if(!nameInput||!phoneInput||!passInput)return toast('فرم ثبت‌نام پیدا نشد؛ صفحه را دوباره باز کنید');
  const full_name=nameInput.value.trim(),phone=latin(phoneInput.value),password=passInput.value;
  if(!full_name)return toast('نام و نام خانوادگی را وارد کنید');
  if(!phone)return toast('شماره همراه را وارد کنید');
  if(!/^09\d{9}$/.test(phone))return toast('شماره همراه باید ۱۱ رقم و با 09 شروع شود');
  if(!password)return toast('رمز عبور را وارد کنید');
  if(password.length<6)return toast('رمز عبور باید حداقل ۶ کاراکتر باشد');
  if(button)button.disabled=true;
  const{ok,d}=await send('/register','POST',{full_name,phone,password});
  if(button)button.disabled=false;
  if(!ok)return toast(d.error||'ثبت‌نام انجام نشد؛ اتصال سرور را بررسی کنید');
  toast('حساب ساخته شد. اکنون با شماره و رمز عبور وارد شوید');
  showAuth(false);
  $('ap').value=phone;
  $('aw').focus();
}
/* ---------- راه‌اندازی و ناوبری ---------- */
function boot(){
  try{U=JSON.parse(localStorage.getItem('user')||'null')}catch{U=null}
  if(!U||!localStorage.getItem('token'))return showAuth(false);
  try{cart=JSON.parse(localStorage.getItem('cart_'+U.id)||'[]')}catch{cart=[]}
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  $('userCard').innerHTML=(U.avatar_url?'<img src="'+esc(U.avatar_url)+'" alt="">':'<span style="font-size:20px">👤</span>')+'<span>'+esc(U.full_name||'حساب کاربری')+'</span>'+(U.is_suspended?'<i class="suspension-dot"></i>':'');
  const N=[['home','home','خانه'],['library','library','کتابخانه'],['events','events','رویدادها'],['forum','forum','تاالر'],['art','art','فروشگاه سیمرغ'],['cafe','cafe','کافه'],['account','account','حساب']];
  $('nav').innerHTML=N.map(([k,i,t])=>`<button data-k="${k}" onclick="go('${k}')">${ic(i)}${t}</button>`).join('');
  go('home');refreshBadges();
}
const TITLES={home:'سیمرغ',cafe:'کافه‌کتاب',library:'کتابخانه',events:'رویدادها',forum:'تالار سیمرغ',art:'فروشگاه سیمرغ',cart:'سبد خرید',account:'حساب کاربری',notifs:'اعلان‌ها',mine:'درخواست‌های من',admin:'پنل مدیریت'};
async function go(p,arg){
  page=p;document.body.dataset.pg=p;if(p==='library'&&arg)libTab=arg;
  $('title').textContent=TITLES[p];$('back').classList.toggle('hidden',p==='home');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===p));
  $('main').innerHTML='<div class="empty">در حال بارگذاری…</div>';scrollTo(0,0);
  await R[p]();
}
function saveCart(){localStorage.setItem('cart_'+U.id,JSON.stringify(cart));refreshBadges()}
async function refreshBadges(){
  const n=cart.reduce((s,i)=>s+i.qty,0);$('cb').textContent=fa(n);$('cb').classList.toggle('hidden',!n);
  const{ok,d}=await api('/notifications');const u=ok?d.filter(x=>!x.is_read).length:0;
  $('nb').textContent=fa(u);$('nb').classList.toggle('hidden',!u);
}
const img=(u,i)=>u?`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph>${i}</div>'">`:`<div class="ph">${i}</div>`;
const list=(a,empty)=>a.length?a:`<div class="empty">${empty}</div>`;

/* ---------- صفحه‌ها ---------- */
const R={
home(){
  const S=[['cafe','cafe','کافه‌کتاب'],['library','library','کتابخانه'],['events','events','رویدادها'],['forum','forum','تاالر سیمرغ'],['art','art','فروشگاه سیمرغ'],['cart','cart','سبد خرید'],['request','request','درخواست کتاب'],['account','account','حساب کاربری']];
  const seg=S.map(([k,i,t],n)=>{const a=n*2*Math.PI/8-Math.PI/2;
    return `<button class="seg" style="left:${50-37*Math.cos(a)}%;top:${50+37*Math.sin(a)}%" onclick="${k==='request'?"go('library','request')":`go('${k}')`}">${ic(i)}${t}</button>`}).join('');
  $('main').innerHTML=`<div class="brand"><img class="lg" src="img/logo-512.png" alt=""><div class="name">سیمرغ</div><p>فرهنگ، هنر، کتاب و تجربه</p></div>
  <div class="wheel"><div class="core"><img src="img/logo-512.png" alt=""></div>${seg}</div><div class="tag">جایی برای رویاها، کتاب‌ها و هنر…</div>`;
},
async cafe(){
  const [m,c]=await Promise.all([api('/menu'),api('/cafe-categories')]);
  if(!m.ok||!c.ok)return $('main').innerHTML='<div class="empty">منو بارگذاری نشد</div>';
  const cats=c.d||[],selected=cats.find(x=>x.id===cache.cafeCat)?.name||'همه';
  const tabs='<div class="tabs"><button class="'+(selected==='همه'?'on':'')+'" onclick="cache.cafeCat=0;go(&quot;cafe&quot;)">همه</button>'+cats.map(x=>'<button class="'+(selected===x.name?'on':'')+'" onclick="cache.cafeCat='+x.id+';go(&quot;cafe&quot;)">'+esc(x.name)+'</button>').join('')+'</div>';
  const categoryCards=selected==='همه'?'<div class="grid">'+cats.map(x=>'<button class="card" onclick="cache.cafeCat='+x.id+';go(&quot;cafe&quot;)">'+(x.image_url?img(x.image_url,'☕'):'<div class="ph">☕</div>')+'<h3>'+esc(x.name)+'</h3><p>'+esc(x.description||'')+'</p></button>').join('')+'</div>':'';
  const products=m.d.filter(x=>selected==='همه'||x.category===selected);
  const items=products.map(i=>'<div class="card">'+(i.image_url?img(i.image_url,'☕'):'')+'<div class="row"><h3>'+esc(i.name)+'</h3><span class="price">'+money(i.price)+'</span></div>'+(i.description?'<p>'+esc(i.description)+'</p>':'')+'</div>').join('')||'<div class="empty">محصولی در این دسته ثبت نشده است</div>';
  $('main').innerHTML=tabs+categoryCards+items;
  /* کافه فقط نمایش منو است؛ سفارش‌گیری تعریف نشده است */
},
async library(){
  const[b,l,c]=await Promise.all([api('/books'),api('/loan-requests/my'),api('/book-categories')]);
  if(!b.ok)return $('main').innerHTML='<div class="empty">بارگذاری نشد</div>';
  cache.books=b.d;cache.bookCats=c.ok?c.d:[];const pend=new Set((l.ok?l.d:[]).filter(x=>x.status==='pending').map(x=>x.book_id));
  const T=[['sale','فروش کتاب'],['loan','امانی'],['request','درخواست کتاب']];
  let body='';
  if(libTab==='sale')body=b.d.filter(x=>x.type==='sale'&&(!cache.bookCat||x.category===cache.bookCat)).map(x=>`<div class="card">${x.image_url?img(x.image_url,'📚'):''}<div class="row"><h3>${esc(x.title)}</h3><span class="price">${money(x.price)}</span></div><p>${esc(x.author||'')}${x.category?' · '+esc(x.category):''}</p>${x.description?`<p>${esc(x.description)}</p>`:''}<button class="btn s" onclick="addCart('book',${x.id})">افزودن به سبد</button></div>`).join('')||'<div class="empty">کتابی برای فروش ثبت نشده است</div>';
  if(libTab==='loan')body=b.d.filter(x=>x.type==='loan'&&(!cache.bookCat||x.category===cache.bookCat)).map(x=>`<div class="card">${x.image_url?img(x.image_url,'📚'):''}<h3>${esc(x.title)}</h3><p>${esc(x.author||'')}</p>${x.description?`<p>${esc(x.description)}</p>`:''}${x.status!=='available'?badge('امانت داده شده','no'):pend.has(x.id)?badge('درخواست شما در حال بررسی است'):`<button class="btn s" onclick="reqLoan(${x.id})">درخواست امانت</button>`}</div>`).join('')||'<div class="empty">کتاب امانی ثبت نشده است</div>';
  if(libTab==='request'){
    const r=await api('/book-requests/my');
    body=`<div class="card"><h3>کتابی می‌خواهید که در سیمرغ نیست؟</h3><label>عنوان کتاب</label><input id="rt"><label>نویسنده یا ناشر (اختیاری)</label><input id="ra"><label>توضیح (اختیاری)</label><textarea id="rd" rows="2"></textarea><button class="btn" onclick="sendBookReq()">ارسال درخواست</button></div>

  else if(admTab==='activeLoans'){const{d=[]}=await api('/admin/active-loans');body=d.map(x=>'<div class="card"><h3>'+esc(x.book_title)+'</h3><p>'+esc(x.full_name)+' · '+esc(x.phone)+'</p><p>تحویل: '+when(x.handed_over_at)+' · سررسید: '+when(x.current_due_at)+'</p><button class="btn" onclick="returnActiveLoan(\''+x.id+'\')">ثبت بازگشت واقعی کتاب</button></div>').join('')||'<div class="empty">امانت فعالی وجود ندارد.</div>'}

  else if(admTab==='fines'){const{d=[]}=await api('/admin/fines');const by={};for(const x of d)(by[x.user_id]??=[]).push(x);body=Object.entries(by).map(([uid,items])=>'<div class="card"><h3>'+esc(items[0].full_name)+' · '+esc(items[0].phone)+'</h3>'+items.map(x=>'<p>'+esc(x.book_title)+' · '+esc(x.fine_date)+' · '+fa(x.points_amount)+' امتیاز</p>').join('')+'<button class="btn" onclick="settleFines(\''+uid+'\')">ثبت تسویه جریمه‌ها</button></div>').join('')||'<div class="empty">جریمه بازی ثبت نشده است.</div>'}
  else if(admTab==='access'){
    if(!U.is_super_admin)body='<div class="empty">فقط مدیر ارشد می‌تواند نقش‌ها و مجوزها را تغییر دهد.</div>';
    else{
      const [pr,rr,pp,fp]=await Promise.all([sb.from("profiles").select("id,display_name,phone,is_suspended,suspension_reason").order("created_at",{ascending:false}).limit(200),sb.from("user_roles").select("user_id,role"),sb.from("admin_permissions").select("*"),sb.from("forum_permissions").select("*")]);
      if(pr.error||rr.error||pp.error||fp.error)body='<div class="empty">دریافت فهرست کاربران و مجوزها ناموفق بود.</div>';
      else{
        const roleMap={},permMap={},forumMap={};for(const x of rr.data||[])(roleMap[x.user_id]??=[]).push(x.role);for(const x of pp.data||[])permMap[x.user_id+'|'+x.permission_key]=x;for(const x of fp.data||[])forumMap[x.user_id]=x;
        const keys=[['cafe.manage','کافه'],['library.manage','کتابخانه'],['store.manage','فروشگاه'],['events.manage','رویدادها'],['forum.moderate','تالار'],['users.manage','کاربران']];
        body=(pr.data||[]).map(p=>{
          const roles=roleMap[p.id]||[],role=roles.includes('super_admin')?'super_admin':roles.some(x=>x!=='member')?'admin':'member';
          const checks=keys.map(([key,label])=>{const v=permMap[p.id+'|'+key]||{};return '<div class="card" style="padding:10px"><b>'+label+'</b><div class="row" style="flex-wrap:wrap">'+[['view','مشاهده'],['create','ایجاد'],['update','ویرایش'],['delete','حذف']].map(([a,t])=>'<label style="margin:4px"><input type="checkbox" id="perm_'+p.id+'_'+key+'_'+a+'" '+(v['can_'+a]?'checked':'')+'> '+t+'</label>').join('')+'</div><button class="btn o s" onclick="saveUserPermission(\''+p.id+'\',\''+key+'\')">ذخیره مجوز '+label+'</button></div>'}).join('');
          return '<div class="card"><h3>'+esc(p.display_name||'بدون نام')+'</h3><p>'+esc(p.phone||'')+'</p><label>نقش</label><select id="role_'+p.id+'"><option value="member" '+(role==='member'?'selected':'')+'>عضو</option><option value="admin" '+(role==='admin'?'selected':'')+'>مدیر دارای مجوزهای انتخابی</option><option value="super_admin" '+(role==='super_admin'?'selected':'')+'>مدیر ارشد</option></select><button class="btn s" onclick="saveUserRole(\''+p.id+'\')">ذخیره نقش</button><label><input type="checkbox" id="suspend_'+p.id+'" '+(p.is_suspended?'checked':'')+'> تعلیق حساب</label><button class="btn o s" onclick="setUserSuspension(\''+p.id+'\')">ذخیره وضعیت حساب</button><label><input type="checkbox" id="topic_'+p.id+'" '+(!!forumMap[p.id]?.can_create_topic?'checked':'')+'> اجازه ایجاد تاپیک</label><button class="btn o s" onclick="setForumPermission(\''+p.id+'\')">ذخیره مجوز تالار</button>'+checks+'</div>';
        }).join('')||'<div class="empty">هنوز کاربری ثبت‌نام نکرده است.</div>';
      }
    }
  }
  else{const{d=[]}=await api('/admin/'+admTab);cache['adm_'+admTab]=d;const nm=i=>i.name||i.title;
    body=`<button class="btn" onclick="admForm('${admTab}')">+ افزودن</button>`+d.map(i=>`<div class="card" style="margin-top:10px;${i.active?'':'opacity:.5'}"><div class="row"><h3>${esc(nm(i))}</h3>${i.active?'':badge('غیرفعال','no')}</div>
    <button class="btn o s" onclick="admForm('${admTab}',${i.id})">ویرایش</button> 
    ${admTab==='events'?`<button class="btn o s" onclick="regs(${i.id})">ثبت‌نام‌شده‌ها</button>`:''} ${i.active?`<button class="btn r s" onclick="admOff('${admTab}',${i.id})">غیرفعال</button>`:''}</div>`).join('')}
  $('main').innerHTML=head+body;
}};

/* ---------- عملیات ---------- */


async function returnActiveLoan(id){if(!confirm('تحویل واقعی این کتاب ثبت شود؟'))return;const{ok,d}=await send('/admin/active-loans/'+id+'/return','PUT');if(!ok)return toast(d.error||'ثبت بازگشت ناموفق بود');toast('بازگشت کتاب ثبت شد');go('admin')}
async function requestLoanExtension(id){const{ok,d}=await send('/loan-extensions','POST',{loan_id:id});if(!ok)return toast(d.error||'ثبت درخواست تمدید ناموفق بود');toast('درخواست تمدید ثبت شد');go('account')}
async function reviewExtension(id,approve){const{ok,d}=await send('/admin/loan-extensions/'+id,'PUT',{status:approve?'approved':'rejected'});if(!ok)return toast(d.error||'ثبت نتیجه ناموفق بود');toast('نتیجه ثبت شد');go('admin')}
async function settleFines(id){if(!confirm('پس از دریافت تسویه حضوری، جریمه‌های باز این کاربر تسویه شوند؟'))return;const{ok,d}=await send('/admin/fines/'+id+'/settle','PUT');if(!ok)return toast(d.error||'تسویه انجام نشد');toast('جریمه‌ها تسویه شدند');go('admin')}
async function saveUserRole(id){const role=$('role_'+id).value;const {error:de}=await sb.from('user_roles').delete().eq('user_id',id).neq('role','member');if(de)return toast(de.message);if(role!=='member'){const {error}=await sb.from('user_roles').upsert({user_id:id,role},{onConflict:'user_id,role'});if(error)return toast(error.message)}toast('نقش ذخیره شد');go('admin')}
async function saveUserPermission(id,key){const a=['view','create','update','delete'],v={};for(const x of a)v['can_'+x]=$('perm_'+id+'_'+key+'_'+x).checked;const allOff=a.every(x=>!v['can_'+x]);if(allOff){const {error}=await sb.from('admin_permissions').delete().eq('user_id',id).eq('permission_key',key);if(error)return toast(error.message)}else{const {error}=await sb.from('admin_permissions').upsert({user_id:id,permission_key:key,...v,granted_by:U.id},{onConflict:'user_id,permission_key'});if(error)return toast(error.message)}toast('مجوز ذخیره شد')}
async function setForumPermission(id){const can_create_topic=$('topic_'+id).checked;if(can_create_topic){const {error}=await sb.from('forum_permissions').upsert({user_id:id,can_create_topic,granted_by:U.id},{onConflict:'user_id'});if(error)return toast(error.message)}else{const {error}=await sb.from('forum_permissions').delete().eq('user_id',id);if(error)return toast(error.message)}toast('مجوز تالار ذخیره شد')}
async function setUserSuspension(id){const is_suspended=$('suspend_'+id).checked;const {error}=await sb.from('profiles').update({is_suspended,suspension_reason:is_suspended?'تعلیق توسط مدیریت':null,suspended_at:is_suspended?new Date().toISOString():null}).eq('id',id);if(error)return toast(error.message);toast('وضعیت حساب ذخیره شد')}

function newForumTopic(){openM('<h3 style="color:var(--gold2)">تاپیک جدید</h3><label>عنوان</label><input id="forumTitle" maxlength="200"><label>متن</label><textarea id="forumBody" rows="5"></textarea><label>تصاویر (اختیاری)</label><input id="forumFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple><button class="btn" onclick="submitForumTopic()">انتشار</button><button class="btn o" onclick="closeM()">انصراف</button>')}
async function submitForumTopic(){
  const title=$("forumTitle").value.trim(),body=$("forumBody").value.trim(),files=[...($("forumFiles").files||[])];
  if(title.length<3||!body)return toast("عنوان و متن تاپیک را کامل کنید");
  if(files.length>5)return toast("حداکثر ۵ تصویر مجاز است");
  const {data:topic,error}=await sb.from("forum_topics").insert({user_id:U.id,title,body}).select().single();
  if(error)return toast(error.message);
  for(const file of files){
    if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>5*1024*1024){toast("فقط JPG، PNG یا WEBP تا ۵ مگابایت مجاز است");continue}
    const path=U.id+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const up=await sb.storage.from("forum-images").upload(path,file,{upsert:false});
    if(!up.error){const ins=await sb.from("forum_topic_images").insert({topic_id:topic.id,storage_path:path,alt_text:file.name});if(ins.error)console.error(ins.error)}
  }
  closeM();toast("تاپیک منتشر شد");go("forum");
}
function replyForum(topicId,parentId){openM('<h3 style="color:var(--gold2)">ثبت نظر</h3><textarea id="forumComment" rows="4" placeholder="متن دیدگاه"></textarea><button class="btn" onclick="submitForumComment(\''+topicId+'\', '+(parentId?"\'"+parentId+"\'":"null")+')">ارسال</button><button class="btn o" onclick="closeM()">انصراف</button>')}
async function submitForumComment(topicId,parentId){const body=$("forumComment").value.trim();if(!body)return toast("متن دیدگاه را وارد کنید");const {error}=await sb.from("forum_comments").insert({topic_id:topicId,user_id:U.id,parent_id:parentId,body});if(error)return toast(error.message);closeM();toast("دیدگاه ثبت شد");go("forum")}
async function hideForumTopic(id){if(!confirm("این تاپیک پنهان شود؟"))return;const {error}=await sb.from("forum_topics").update({status:"hidden"}).eq("id",id);if(error)return toast(error.message);go("forum")}
async function logout(){try{await sb.auth.signOut()}catch(e){console.warn(e)}localStorage.removeItem("token");localStorage.removeItem("user");U=null;cart=[];showAuth(false)}

function addCart(type,id){
  const src=type==='book'?cache.books:cache.art,it=src.find(x=>x.id===id),ex=cart.find(c=>c.type===type&&c.id===id);
  if(ex)ex.qty++;else cart.push({type,id,title:it.title||it.name,price:it.price,qty:1,note:''});
  saveCart();toast('به سبد اضافه شد');
}
function qty(n,d){cart[n].qty+=d;if(cart[n].qty<1)cart.splice(n,1);saveCart();R.cart()}
async function submitCart(){
  const{ok,d}=await send('/purchase-requests','POST',{items:cart.map(({type,id,qty,note})=>({type,id,qty,note})),contact_phone:latin($('cp').value),note:$('cn').value});
  if(!ok)return toast(d.error||'ثبت نشد');
  cart=[];saveCart();toast('درخواست خرید ثبت شد؛ مدیریت با شما تماس می‌گیرد');go('mine');
}
function reqLoan(id){openM('<h3 style="color:var(--gold2)">درخواست امانت</h3><p class="sub">حداقل مبلغ پیشنهادی ۲۰٬۰۰۰ تومان است.</p><label>مبلغ پیشنهادی (تومان)</label><input id="loanAmount" inputmode="numeric" placeholder="۲۰۰۰۰"><button class="btn" onclick="submitLoan(${id})">ثبت درخواست</button><button class="btn o" onclick="closeM()">انصراف</button>')}
async function submitLoan(id){const amount=Number(latin($('loanAmount').value));if(amount<20000)return toast('مبلغ پیشنهادی نباید کمتر از ۲۰٬۰۰۰ تومان باشد');const{ok,d}=await send('/loan-requests','POST',{book_id:id,proposed_amount_toman:amount});if(!ok)return toast(d.error||'ثبت درخواست انجام نشد');closeM();toast('درخواست امانت ثبت شد');go('library')}
async function sendBookReq(){
  const book_title=$('rt').value.trim();if(!book_title)return toast('عنوان کتاب را وارد کنید');
  const{ok,d}=await send('/book-requests','POST',{book_title,author:$('ra').value,description:$('rd').value});
  toast(ok?'درخواست ثبت شد':d.error);if(ok)go('library','request');
}
function reg(id){const e=(cache.events||[]).find(x=>x.id===id)||{};const count=Number(e.required_teammates||0);let h='<h3 style="color:var(--gold2)">ثبت‌نام در رویداد</h3><label>نام و نام خانوادگی</label><input id="regName" value="'+esc(U.full_name)+'"><label>شماره تماس</label><input id="regPhone" value="'+esc(U.phone)+'" style="direction:ltr;text-align:left">';for(let i=0;i<count;i++)h+='<div class="sec">همراه '+(i+1)+'</div><label>نام و نام خانوادگی</label><input id="teamName'+i+'"><label>شماره تماس</label><input id="teamPhone'+i+'" style="direction:ltr;text-align:left">';h+='<button class="btn" onclick="submitEventReg('+id+','+count+')">تأیید ثبت‌نام</button><button class="btn o" onclick="closeM()">انصراف</button>';openM(h)}
async function submitEventReg(id,count){const teammates=[];for(let i=0;i<count;i++){const full_name=$('teamName'+i).value.trim(),phone=latin($('teamPhone'+i).value);if(!full_name||!phone)return toast('اطلاعات همه همراهان را کامل کنید');teammates.push({full_name,phone,sort_order:i+1})}const{ok,d}=await send('/events/'+id+'/register','POST',{registrant_name:$('regName').value.trim(),registrant_phone:latin($('regPhone').value),teammates});if(!ok)return toast(d.error||'ثبت‌نام انجام نشد');closeM();toast('ثبت‌نام انجام شد');go('events')}
async function unreg(id){const{ok}=await send(`/events/${id}/register`,'DELETE');toast(ok?'ثبت‌نام لغو شد':'خطا');go('events')}
function editProfile(){openM('<h3 style="color:var(--gold2)">مشخصات کاربری</h3><label>نام نمایشی</label><input id="pn" value="'+esc(U.full_name)+'"><label>نام کاربری</label><input id="pu" value="'+esc(U.username||"")+'"><label>توضیح کوتاه</label><textarea id="pb" rows="2">'+esc(U.bio||"")+'</textarea><label>نشانی تصویر پروفایل (اختیاری)</label><input id="pa" value="'+esc(U.avatar_url||"")+'"><label>شماره همراه</label><input value="'+esc(U.phone)+'" disabled style="direction:ltr;text-align:left"><button class="btn" onclick="saveProfile()">ذخیره</button><button class="btn o" onclick="closeM()">بستن</button>')}
async function saveProfile(){const{ok,d}=await send('/profile','PUT',{full_name:$('pn').value,username:$('pu').value,bio:$('pb').value,avatar_url:$('pa').value});if(!ok)return toast(d.error||'خطا');U={...U,...d};localStorage.setItem('user',JSON.stringify(U));closeM();boot();go('account')}
async function loanSt(id,status){const{ok,d}=await send('/admin/loan-requests/'+id,'PUT',{status});toast(ok?'ثبت شد':d.error);go('admin')}
async function admOff(r,id){if(!confirm('این مورد غیرفعال شود؟'))return;await send(`/admin/${r}/${id}`,'DELETE');go('admin')}
async function regs(id){const{d=[]}=await api(`/admin/events/${id}/registrations`);let h='<h3 style="color:var(--gold2)">ثبت‌نام‌شده‌ها ('+fa(d.length)+')</h3>';h+=d.map(r=>'<div class="card"><b>'+esc(r.full_name)+'</b><p>'+esc(r.phone)+'</p>'+((r.people||[]).map(p=>'<div class="row" style="margin-top:6px"><span>'+esc(p.full_name)+' · '+esc(p.phone)+'</span><span><button class="btn s" onclick="markAttendance(\''+p.id+'\',\'present\')">حاضر</button><button class="btn r s" onclick="markAttendance(\''+p.id+'\',\'absent\')">غایب</button></span></div>').join(''))+'</div>').join('')||'<div class="empty">کسی ثبت‌نام نکرده</div>';h+='<button class="btn o" onclick="closeM()">بستن</button>';openM(h)}
async function markAttendance(id,status){const{ok,d}=await send('/admin/event-attendance/'+id,'PUT',{status});if(!ok)return toast(d.error||'ثبت حضور ناموفق بود');toast('وضعیت حضور ثبت شد');closeM()}
const F={ /* [کلید، برچسب، نوع، الزامی/گزینه‌ها] */
 cafeCats:[['name','نام دسته','t',1],['description','توضیح','a'],['image_url','آدرس تصویر'],['sort','ترتیب نمایش','n']],
 bookCats:[['name','نام موضوع','t',1],['description','توضیح','a'],['image_url','آدرس تصویر'],['sort','ترتیب نمایش','n']],
 storeCats:[['name','نام موضوع','t',1],['description','توضیح','a'],['image_url','آدرس تصویر'],['sort','ترتیب نمایش','n']],
 menu:[['name','نام','t',1],['category','دسته (مثلاً قهوه، دسر)'],['description','توضیح','a'],['price','قیمت (تومان)','n'],['image_url','آدرس تصویر'],['sort','ترتیب نمایش','n']],
 books:[['title','عنوان','t',1],['author','نویسنده'],['category','موضوع'],['description','توضیح','a'],['type','نوع','s',{loan:'امانی',sale:'فروشی',both:'امانی و فروشی'}],['price','قیمت (تومان، برای فروشی)','n'],['total_copies','تعداد نسخه‌ها','n'],['image_url','آدرس تصویر']],
 art:[['name','نام','t',1],['category','دسته (رزین، شمع، ویترای…)'],['description','توضیح','a'],['price','قیمت (تومان)','n'],['stock_status','موجودی','s',{in_stock:'موجود',made_to_order:'ساخت بر اساس سفارش',out:'ناموجود'}],['allow_custom','امکان سفارشی‌سازی','b'],['image_url','آدرس تصویر']],
 events:[['title','عنوان','t',1],['description','توضیح','a'],['event_type','نوع رویداد','s',{weekly:'هفتگی (بدون ثبت‌نام)',timed:'زمان‌دار'}],['event_date','تاریخ و زمان','d'],['location','مکان'],['capacity','ظرفیت کل افراد (خالی = نامحدود)','n'],['required_teammates','تعداد همراه الزامی','n'],['registration_open','ثبت‌نام باز باشد','b'],['points_on_registration','امتیاز ثبت‌نام','n'],['points_on_attendance','امتیاز حضور','n'],['award_points_when','زمان اعطای امتیاز مثبت','s',{disabled:'غیرفعال / تعیین‌نشده',registration:'هنگام ثبت‌نام',attendance:'پس از حضور تأییدشده'}],['rules_text','قوانین رویداد','a'],['image_url','آدرس پوستر']]};
function admForm(r,id){
  const it=id?cache['adm_'+r].find(x=>x.id===id):{registration_open:true,event_type:'timed',award_points_when:'disabled',type:'loan',total_copies:1,stock_status:'in_stock'};
  const dt=v=>v?new Date(new Date(v).getTime()-new Date(v).getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
  openM(`<h3 style="color:var(--gold2)">${id?'ویرایش':'افزودن'}</h3>`+F[r].map(([k,l,t,o])=>{const v=it[k]??'';
    return t==='b'?`<label><input type="checkbox" id="f_${k}" ${v?'checked':''}> ${l}</label>`:`<label>${l}</label>`+(t==='a'?`<textarea id="f_${k}" rows="2">${esc(v)}</textarea>`:t==='s'?`<select id="f_${k}">${Object.entries(o).map(([a,b])=>`<option value="${a}" ${a===v?'selected':''}>${b}</option>`).join('')}</select>`:`<input id="f_${k}" type="${t==='d'?'datetime-local':'text'}" ${t==='n'?'inputmode="numeric"':''} value="${esc(t==='d'?dt(v):v)}">`)}).join('')+
  `<button class="btn" onclick="admSave('${r}',${id||0})">ذخیره</button><button class="btn o" onclick="closeM()">بستن</button>`);
}
async function admSave(r,id){
  const b={};
  for(const [k,,t,o] of F[r]){const e=$('f_'+k);let v=t==='b'?e.checked:e.value.trim();
    if(t==='n')v=latin(v);if(t==='d'&&v)v=new Date(v).toISOString();
    if(o===1&&!v)return toast('فیلدهای الزامی را پر کنید');b[k]=v}
  if(id)b.active=true;
  const{ok,d}=await send(id?`/admin/${r}/${id}`:`/admin/${r}`,id?'PUT':'POST',b);
  if(!ok)return toast(d.error||'ذخیره نشد');closeM();toast('ذخیره شد');go('admin');
}
boot();
</script>
