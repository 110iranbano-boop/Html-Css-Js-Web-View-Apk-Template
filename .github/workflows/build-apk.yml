
name: Build Simorgh Cafe APK

on:
  push:
    branches:
      - main
      - supabase-full-integration
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate application JavaScript
        run: |
          node --check server/server.js
          python -c "import re,pathlib; h=pathlib.Path('www/index.html').read_text(encoding='utf-8'); s=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',h,re.I); pathlib.Path('/tmp/simorgh-inline.js').write_text(s[-1],encoding='utf-8')"
          node --check /tmp/simorgh-inline.js

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/Simorgh-Cafe.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simorgh-Cafe-APK
          path: output/Simorgh-Cafe.apk
          if-no-files-found: error
