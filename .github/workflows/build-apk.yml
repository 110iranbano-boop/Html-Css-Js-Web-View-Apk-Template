name: Build Simorgh Cafe APK

on:
  push:
    branches:
      - main
      - simorgh-supabase-completion-v2
      - fix/forum-admin-profile-view
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Validate application JavaScript
        run: |
          node --check www/supabase.js
          node -e "const fs=require('fs'); const html=fs.readFileSync('www/index.html','utf8'); const m=html.match(/<script>\\s*([\\s\\S]*?)\\s*<\\/script>\\s*<\\/body>/i); if(!m) throw new Error('Inline application script not found'); fs.writeFileSync('/tmp/simorgh-index.js',m[1]);"
          node --check /tmp/simorgh-index.js

      - name: Validate bundled image assets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const refs = new Set([
            ...Array.from(html.matchAll(/url\((['"]?)(img\/[^)'"]+)\1\)/g), m => m[2]),
            ...Array.from(html.matchAll(/(?:src|href)=["'](img\/[^"']+)["']/g), m => m[1]),
          ]);
          for (const ref of refs) {
            const file = path.join('www', ref);
            if (!fs.existsSync(file)) throw new Error('Missing bundled image: ' + file);
          }
          console.log('Verified ' + refs.size + ' local image references.');
          NODE

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android launcher icons
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_android_icons.py
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/Simorgh-Cafe.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simorgh-Cafe-APK
          path: output/Simorgh-Cafe.apk
          if-no-files-found: error

# Re-run Android build after repairing the checked-in launcher artwork.
