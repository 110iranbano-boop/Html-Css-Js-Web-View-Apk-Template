
name: Build Simorgh Cafe APK

on:
  push:
    branches:
      - main
      - fix/admin-loading-and-middleware
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/Simorgh-Cafe.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simorgh-Cafe-APK
          path: output/Simorgh-Cafe.apk
          if-no-files-found: error
