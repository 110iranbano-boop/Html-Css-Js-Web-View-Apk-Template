
name: Build Simorgh Cafe APK

on:
  push:
    branches:
      - main
      - simorgh-supabase-completion-v2
      - fix/forum-admin-profile-view
      - design/persian-simorgh-redesign
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Validate application JavaScript
        run: |
          node --check www/supabase.js
          node -e "const fs=require('fs'); const html=fs.readFileSync('www/index.html','utf8'); const m=html.match(/<script>\\s*([\\s\\S]*?)\\s*<\\/script>\\s*<\\/body>/i); if(!m) throw new Error('Inline application script not found'); fs.writeFileSync('/tmp/simorgh-index.js',m[1]);"
          node --check /tmp/simorgh-index.js

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate branded Android launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert www/img/logo-512.png -resize 640x640 -gravity center -background none -extent 1024x1024 /tmp/simorgh-app-icon.png
          RES="android/app/src/main/res"
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            mkdir -p "$RES/mipmap-$density"
            convert /tmp/simorgh-app-icon.png -resize "${size}x${size}" "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
            convert /tmp/simorgh-app-icon.png -resize "${size}x${size}" "$RES/mipmap-$density/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          cat > "$RES/values/ic_launcher_background.xml" <<'EOF'
          <resources><color name="ic_launcher_background">#073437</color></resources>
          EOF


      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/Simorgh-Cafe.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simorgh-Cafe-APK
          path: output/Simorgh-Cafe.apk
          if-no-files-found: error
